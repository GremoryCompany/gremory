<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gremory | Pokédex</title>
  <meta name="description" content="Gremory Pokédex com 1ª, 2ª e 3ª geração." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="gremory-page">
    <section class="hero-card">
      <div class="hero-text">
        <p class="eyebrow">Gremory Project</p>
        <h1>Pokédex integrada</h1>
        <p>
          Clique no Gastly para abrir a Pokédex no centro da tela.
          Escolha entre 1ª, 2ª ou 3ª geração e pesquise por nome ou número.
        </p>
      </div>
      <div class="hero-pokemon">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/94.gif" alt="Gengar" />
      </div>
    </section>
  </main>

  <button id="openPokedexBtn" class="pokedex-float-btn" title="Abrir Pokédex" aria-label="Abrir Pokédex">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/92.gif" alt="Gastly" />
    <span>Pokédex</span>
  </button>

  <div id="pokedexOverlay" class="pokedex-overlay" aria-hidden="true">
    <section class="pokedex-modal" role="dialog" aria-modal="true" aria-labelledby="pokedexTitle">
      <header class="pokedex-header">
        <div>
          <p class="pokedex-small">Gremory Database</p>
          <h2 id="pokedexTitle">📘 Pokédex</h2>
          <p>Escolha uma geração. O conteúdo carrega leve usando sprites externos.</p>
        </div>
        <button id="closePokedexBtn" class="pokedex-close" aria-label="Fechar Pokédex">×</button>
      </header>

      <nav class="pokedex-tabs" aria-label="Gerações da Pokédex">
        <button class="pokedex-tab active" data-gen="1">1ª Geração</button>
        <button class="pokedex-tab" data-gen="2">2ª Geração</button>
        <button class="pokedex-tab" data-gen="3">3ª Geração</button>
      </nav>

      <div class="pokedex-search-box">
        <input id="pokedexSearch" type="text" placeholder="Pesquisar por nome ou número..." autocomplete="off" />
      </div>

      <div id="pokedexStatus" class="pokedex-status">Carregando Pokédex...</div>
      <div id="pokedexGrid" class="pokedex-grid"></div>
    </section>
  </div>

  <div id="pokemonDetailOverlay" class="pokemon-detail-overlay" aria-hidden="true">
    <section class="pokemon-detail-modal" role="dialog" aria-modal="true">
      <button id="closePokemonDetailBtn" class="pokemon-detail-close" aria-label="Fechar detalhes">×</button>
      <div id="pokemonDetailContent"></div>
    </section>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
